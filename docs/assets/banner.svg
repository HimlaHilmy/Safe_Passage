<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="40%" stop-color="#10243A"/>
      <stop offset="100%" stop-color="#183B56"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.04" stroke-width="1"/>
      <circle cx="40" cy="40" r="1" fill="#FFFFFF" fill-opacity="0.1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Decorative Ambient Circles -->
  <circle cx="1080" cy="80" r="160" fill="#14B8A6" fill-opacity="0.08" filter="url(#glow)"/>
  <circle cx="120" cy="320" r="140" fill="#EF4444" fill-opacity="0.06" filter="url(#glow)"/>
  <circle cx="600" cy="200" r="280" fill="#3B82F6" fill-opacity="0.03"/>

  <!-- Main Shield Emblem Graphic -->
  <g transform="translate(100, 75)">
    <!-- Pulse Rings -->
    <circle cx="65" cy="80" r="75" fill="none" stroke="#14B8A6" stroke-opacity="0.2" stroke-width="2"/>
    <circle cx="65" cy="80" r="95" fill="none" stroke="#14B8A6" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="6 6"/>

    <!-- Shield Background -->
    <path d="M65 15 L125 42 C125 95 95 135 65 150 C35 135 5 95 5 42 Z" fill="#10243A" stroke="url(#tealGrad)" stroke-width="4"/>
    <path d="M65 25 L115 48 C115 90 90 124 65 138 C40 124 15 90 15 48 Z" fill="#183B56" fill-opacity="0.6"/>

    <!-- Medical & Beacon Cross Symbol -->
    <rect x="57" y="52" width="16" height="52" rx="4" fill="#14B8A6"/>
    <rect x="39" y="70" width="52" height="16" rx="4" fill="#14B8A6"/>
    <!-- Center Radiant Core -->
    <circle cx="65" cy="78" r="6" fill="#FFFFFF"/>
  </g>

  <!-- Content Group -->
  <g transform="translate(260, 95)">
    <!-- Category Tag -->
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#14B8A6" fill-opacity="0.15" stroke="#14B8A6" stroke-opacity="0.4"/>
    <circle cx="14" cy="14" r="5" fill="#14B8A6"/>
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#2DD4BF" letter-spacing="1.5">EMERGENCY DISPATCH &amp; LIFE SAFETY</text>

    <!-- Main Title -->
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#FFFFFF" letter-spacing="-1">Safe Passage</text>
    <text x="325" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="#14B8A6">.</text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#E2E8F0">
      Travel with confidence. <tspan fill="#2DD4BF" font-weight="600">Get help when it matters.</tspan>
    </text>
    <text x="0" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14.5" font-weight="400" fill="#94A3B8">
      A mission-critical emergency orchestration platform connecting travelers, verified first responders, and operation command centers.
    </text>

    <!-- Architecture & Capability Badges -->
    <g transform="translate(0, 180)">
      <!-- Badge 1: FSM Engine -->
      <g transform="translate(0, 0)">
        <rect width="180" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">⚙️ Finite State Engine</text>
      </g>

      <!-- Badge 2: Leaflet & 2dsphere -->
      <g transform="translate(192, 0)">
        <rect width="185" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">📍 2dsphere Spatial Radar</text>
      </g>

      <!-- Badge 3: Real-Time Sockets -->
      <g transform="translate(389, 0)">
        <rect width="175" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <circle cx="20" cy="17" r="4" fill="#22C55E"/>
        <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">Socket.io Real-Time</text>
      </g>

      <!-- Badge 4: Recharts Analytics -->
      <g transform="translate(576, 0)">
        <rect width="185" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
        <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#FFFFFF">📊 Recharts Command Hub</text>
      </g>
    </g>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#tealGrad)"/>
</svg>

