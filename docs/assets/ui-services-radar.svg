<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <filter id="shadow2" x="-10%" y="-5%" width="120%" height="115%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="680" fill="#0E1726" rx="20"/>

  <!-- Window Container -->
  <g transform="translate(30, 25)" filter="url(#shadow2)">
    <rect width="1040" height="630" rx="16" fill="#F8FAFC"/>

    <!-- Window Title Bar -->
    <path d="M0 16 Q0 0 16 0 L1024 0 Q1040 0 1040 16 L1040 48 L0 48 Z" fill="#10243A"/>
    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>
    <rect x="250" y="12" width="540" height="24" rx="6" fill="#1E293B"/>
    <text x="520" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">safepassage.org/traveler/services — Geospatial Emergency Radar &amp; Discovery</text>

    <!-- Top Sub-Bar Controls -->
    <g transform="translate(0, 48)">
      <rect width="1040" height="60" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      
      <!-- Category Filter Pills -->
      <g transform="translate(24, 12)">
        <!-- All (Active) -->
        <rect width="70" height="36" rx="18" fill="#10243A"/>
        <text x="35" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">All (28)</text>

        <!-- Hospitals -->
        <g transform="translate(78, 0)">
          <rect width="130" height="36" rx="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
          <text x="65" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">🏥 Trauma (8)</text>
        </g>

        <!-- Police Stations -->
        <g transform="translate(216, 0)">
          <rect width="125" height="36" rx="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
          <text x="62" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">👮 Police (6)</text>
        </g>

        <!-- Towing & Mechanic -->
        <g transform="translate(349, 0)">
          <rect width="135" height="36" rx="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
          <text x="67" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">🚗 Towing (9)</text>
        </g>

        <!-- Embassies -->
        <g transform="translate(492, 0)">
          <rect width="130" height="36" rx="18" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
          <text x="65" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#334155" text-anchor="middle">🏛️ Embassies (5)</text>
        </g>
      </g>

      <!-- Radius Dropdown Selector -->
      <g transform="translate(850, 12)">
        <rect width="166" height="36" rx="8" fill="#F0FDFA" stroke="#14B8A6" stroke-width="1"/>
        <text x="18" y="23" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#0F766E">Radius: 10 km (Max)</text>
        <path d="M142 16 L148 22 L154 16" stroke="#0F766E" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- Main Content Area: Split 40% List / 60% Map -->
    <g transform="translate(0, 108)">
      <!-- Left Panel: Facility Cards List -->
      <g transform="translate(0, 0)">
        <rect width="400" height="522" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
        
        <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" fill="#1E293B">VERIFIED PROXIMITY RESULTS (SRI LANKA)</text>
        
        <!-- Card 1: National Hospital -->
        <g transform="translate(18, 42)">
          <rect width="364" height="135" rx="12" fill="#FFFFFF" stroke="#14B8A6" stroke-width="2"/>
          <rect x="0" y="0" width="6" height="135" rx="3" fill="#14B8A6"/>
          
          <rect x="18" y="14" width="85" height="20" rx="4" fill="#FEE2E2"/>
          <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#991B1B">TRAUMA UNIT</text>

          <rect x="270" y="14" width="80" height="20" rx="10" fill="#F0FDFA"/>
          <text x="310" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#0F766E" text-anchor="middle">1.2 km away</text>

          <text x="18" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#10243A">National Hospital Trauma Unit</text>
          <text x="18" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#64748B">Regent Street, Colombo 10 • 24/7 Service</text>

          <g transform="translate(18, 92)">
            <rect width="155" height="30" rx="6" fill="#10243A"/>
            <text x="77" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">📞 Hotline 1990</text>

            <rect x="165" y="0" width="165" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
            <text x="247" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">🗺️ View on Map</text>
          </g>
        </g>

        <!-- Card 2: Tourist Police Command -->
        <g transform="translate(18, 192)">
          <rect width="364" height="135" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
          <rect x="18" y="14" width="95" height="20" rx="4" fill="#DBEAFE"/>
          <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#1E40AF">TOURIST POLICE</text>

          <rect x="270" y="14" width="80" height="20" rx="10" fill="#F1F5F9"/>
          <text x="310" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">2.4 km away</text>

          <text x="18" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#10243A">Central Tourist Police Command</text>
          <text x="18" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#64748B">Chatham Street, Fort, Colombo 01</text>

          <g transform="translate(18, 92)">
            <rect width="155" height="30" rx="6" fill="#10243A"/>
            <text x="77" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">📞 Hotline 119</text>

            <rect x="165" y="0" width="165" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
            <text x="247" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">🗺️ View on Map</text>
          </g>
        </g>

        <!-- Card 3: Towing Base -->
        <g transform="translate(18, 342)">
          <rect width="364" height="135" rx="12" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
          <rect x="18" y="14" width="95" height="20" rx="4" fill="#FEF3C7"/>
          <text x="24" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#92400E">24/7 TOWING</text>

          <rect x="270" y="14" width="80" height="20" rx="10" fill="#F1F5F9"/>
          <text x="310" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#475569" text-anchor="middle">4.8 km away</text>

          <text x="18" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#10243A">Apex Expressway Recovery Fleet</text>
          <text x="18" y="72" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" fill="#64748B">Kottawa Interchange, High Level Road</text>

          <g transform="translate(18, 92)">
            <rect width="155" height="30" rx="6" fill="#10243A"/>
            <text x="77" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">📞 Hotline 1969</text>

            <rect x="165" y="0" width="165" height="30" rx="6" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1"/>
            <text x="247" y="20" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#334155" text-anchor="middle">🗺️ View on Map</text>
          </g>
        </g>
      </g>

      <!-- Right Panel: Interactive Leaflet Map Visualization -->
      <g transform="translate(400, 0)">
        <rect width="640" height="522" fill="#E2E8F0"/>
        
        <!-- Map Water Bodies & Coastline -->
        <path d="M 0 0 L 140 0 C 120 180 80 340 0 522 Z" fill="#BFDBFE"/>
        <text x="40" y="220" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#3B82F6" transform="rotate(-70 40 220)">Indian Ocean (West Coast)</text>

        <!-- Main Roads -->
        <path d="M 120 0 Q 180 200 160 522" stroke="#FFFFFF" stroke-width="10" fill="none"/>
        <path d="M 120 0 Q 180 200 160 522" stroke="#FDE047" stroke-width="4" fill="none"/>
        <path d="M 140 260 L 640 240" stroke="#FFFFFF" stroke-width="8" fill="none"/>
        <path d="M 140 260 L 640 240" stroke="#CBD5E1" stroke-width="4" fill="none"/>
        <path d="M 300 0 L 320 522" stroke="#FFFFFF" stroke-width="6" fill="none"/>
        <path d="M 160 380 Q 420 360 640 440" stroke="#FFFFFF" stroke-width="8" fill="none"/>

        <!-- User Central Beacon (Galle Face) -->
        <g transform="translate(180, 240)">
          <circle cx="0" cy="0" r="140" fill="#14B8A6" fill-opacity="0.08" stroke="#14B8A6" stroke-width="1" stroke-dasharray="4 4"/>
          <circle cx="0" cy="0" r="70" fill="#14B8A6" fill-opacity="0.12"/>
          <circle cx="0" cy="0" r="18" fill="#14B8A6"/>
          <circle cx="0" cy="0" r="8" fill="#FFFFFF"/>
          
          <rect x="-65" y="-55" width="130" height="28" rx="14" fill="#10243A"/>
          <text x="0" y="-37" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">You Are Here</text>
        </g>

        <!-- Hospital Marker 1 -->
        <g transform="translate(260, 160)">
          <circle cx="0" cy="0" r="16" fill="#EF4444"/>
          <rect x="-2" y="-9" width="4" height="18" fill="#FFFFFF"/>
          <rect x="-9" y="-2" width="18" height="4" fill="#FFFFFF"/>
          
          <!-- Leaflet Interactive Popup -->
          <g transform="translate(-100, -90)">
            <rect width="200" height="74" rx="8" fill="#FFFFFF" filter="url(#shadow2)"/>
            <polygon points="100,74 92,84 108,74" fill="#FFFFFF"/>
            <text x="14" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#10243A">National Hospital Trauma</text>
            <text x="14" y="40" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748B">Distance: 1.2 km • ETA: 4m</text>
            <text x="14" y="58" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#0D9488">Ambulance Hotline: 1990</text>
          </g>
        </g>

        <!-- Police Marker -->
        <g transform="translate(195, 100)">
          <circle cx="0" cy="0" r="14" fill="#3B82F6"/>
          <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">🛡️</text>
        </g>

        <!-- Towing Marker -->
        <g transform="translate(420, 360)">
          <circle cx="0" cy="0" r="14" fill="#F59E0B"/>
          <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">🔧</text>
        </g>

        <!-- Map Controls Overlay -->
        <g transform="translate(580, 20)">
          <rect width="40" height="82" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/>
          <text x="20" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">+</text>
          <line x1="8" y1="41" x2="32" y2="41" stroke="#E2E8F0" stroke-width="1"/>
          <text x="20" y="68" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#334155" text-anchor="middle">−</text>
        </g>
      </g>
    </g>
  </g>
</svg>

