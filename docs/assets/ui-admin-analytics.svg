    <circle cx="24" cy="24" r="6" fill="#EF4444"/>
    <circle cx="44" cy="24" r="6" fill="#F59E0B"/>
    <circle cx="64" cy="24" r="6" fill="#10B981"/>
    <rect x="250" y="12" width="540" height="24" rx="6" fill="#1E293B"/>
    <text x="520" y="28" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">safepassage.org/admin/dashboard — Central Operations &amp; Real-Time Analytics</text>

    <!-- Header & Source Verification -->
    <g transform="translate(24, 60)">
      <div style="display: flex;">
        <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="800" fill="#10243A">National Operations Command Room</text>
        <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#64748B">Central oversight, provider accreditation, incident SLAs, and compliance auditing.</text>
