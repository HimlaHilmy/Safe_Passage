      <!-- KPI 1 -->
      <g transform="translate(0, 0)">
        <rect width="236" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#64748B">TOTAL EMERGENCIES</text>
        <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#10243A">142</text>
        <text x="75" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#22C55E">↑ +14% wk</text>
        <circle cx="198" cy="40" r="18" fill="#F1F5F9"/>
        <text x="198" y="45" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" text-anchor="middle">🚨</text>
      </g>

      <!-- KPI 2 -->
      <g transform="translate(252, 0)">
        <rect width="236" height="80" rx="10" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#64748B">ACTIVE RESPONDERS</text>
        <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#14B8A6">28</text>
        <text x="65" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#14B8A6">Units Online</text>
