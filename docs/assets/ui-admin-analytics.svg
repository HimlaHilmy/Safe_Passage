        <text x="18" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" fill="#64748B">AVG INITIAL DISPATCH SLA</text>
        <text x="18" y="56" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#3B82F6">4.8m</text>
        <text x="90" y="54" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#22C55E">⚡ Sub-5m</text>
