        <text x="16" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">2026-11-05 09:18:24</text>
        <text x="160" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#10243A">provider@safepassage.org (Provider)</text>
        <text x="380" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#334155">DISPATCH_STATUS_TRANSITION</text>
        <text x="640" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">Incident #INC-8942 (Dispatched)</text>
        <rect x="855" y="4" width="70" height="20" rx="10" fill="#DCFCE7"/>
        <text x="890" y="18" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10.5" font-weight="700" fill="#15803D" text-anchor="middle">SUCCESS</text>
      </g>

      <!-- Row 3 -->
