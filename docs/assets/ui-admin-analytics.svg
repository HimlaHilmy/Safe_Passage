        <text x="32" y="24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11.5" font-weight="700" fill="#15803D">Live MongoDB Aggregation Engine</text>
      </g>
    </g>

    <!-- 4 KPI Cards -->
